name: kaggle-auth-check
# Read-only diagnostic. Confirms KAGGLE_USERNAME/KAGGLE_KEY reach the CLI and are
# accepted by Kaggle, without printing either value. Probes generic endpoints first
# so a competition-rules problem is distinguishable from a bad key.
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      COMPETITION: ${{ vars.KAGGLE_COMPETITION }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "kaggle<2"
      - name: Credential shape (no values printed)
        run: |
          python - <<'PY'
          import os
          QUOTES = chr(34) + chr(39)
          NEWLINES = chr(10) + chr(13)
          for n in ("KAGGLE_USERNAME", "KAGGLE_KEY"):
              v = os.environ.get(n, "")
              t = v.strip()
              print(n, "len=%d" % len(v), "len_stripped=%d" % len(t),
                    "has_quote=%s" % any(c in v for c in QUOTES),
                    "has_space=%s" % (" " in v),
                    "has_newline=%s" % any(c in v for c in NEWLINES),
                    "alnum=%s" % t.isalnum(),
                    "is_lower=%s" % (t == t.lower()))
          PY
      - name: Auth probe A - legacy client, username + key
        run: |
          set +e
          echo "--- 1.x competitions list ---"
          kaggle competitions list 2>&1 | head -4
          exit 0
      - name: Auth probe B - 2.x client, KAGGLE_API_TOKEN
        run: |
          set +e
          pip install -q -U "kaggle>=2"
          unset KAGGLE_USERNAME KAGGLE_KEY
          export KAGGLE_API_TOKEN="${STORED_KEY}"
          echo "--- 2.x competitions list (key as API token) ---"
          kaggle competitions list 2>&1 | head -6
          exit 0
        env:
          STORED_KEY: ${{ secrets.KAGGLE_KEY }}
