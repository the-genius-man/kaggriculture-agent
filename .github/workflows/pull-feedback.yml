name: pull-feedback
# Plane 1 read-only: pull leaderboard + our submissions (+ best-effort episodes) into
# analysis/, and commit. The DIAGNOSIS is done separately by Claude Code + Kaggle MCP.
on:
  schedule: [{ cron: "0 */6 * * *" }]   # every 6h; adjust
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      # kaggle 2.x authenticates with a single API token; the stored
      # KAGGLE_KEY secret holds that token.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
      COMPETITION: ${{ vars.KAGGLE_COMPETITION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "kaggle>=2" requests
      - run: python tools/pull_feedback.py --competition "$COMPETITION" --out analysis/feedback
      # Real per-episode results: our cash vs the opponent's, who they were, and
      # the rating delta. Unauthenticated endpoint, so it cannot fail on credentials.
      - run: python tools/pull_episodes.py --out analysis/feedback || true
      - name: Commit feedback
        run: |
          git config user.name kaggle-bot; git config user.email bot@users.noreply.github.com
          git add -f analysis/feedback && git commit -m "feedback $(date -u +%FT%TZ)" || echo "no changes"
          git push || echo "nothing to push"
